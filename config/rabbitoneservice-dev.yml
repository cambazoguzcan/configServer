ogi:
  deneme: 8
feature-flags:
  gitProcess: true
messaging:
  enabled: true
  queues:
    rabbit_one_queue:
      enable: true
      durable: true
      name: rabbit_one_queue
      routingKey: rabbit_one_queue_rk
      withDlq: false
      exchange:
        name: rabbit_one_queue_exchange
        durable: true
        type: direct
    rabbit_two_queue:
      enable: true
      durable: true
      name: rabbit_two_queue
      routingKey: rabbit_two_queue_rk
      arguments:
        x-dead-letter-exchange: rabbit_two_queue_exchange
        x-dead-letter-routing-key: rabbit_two_queue_dlq_rk # dlq routing key.
        x-queue-mode: lazy
      withDlq: true
      dlqName: rabbit_two_queue_dlq
      dlqRoutingKey: rabbit_two_queue_dlq_rk
      retryCount: 3
      dlqArguments:
        x-dead-letter-exchange: rabbit_two_queue_exchange
        x-dead-letter-routing-key: rabbit_two_queue_rk # main queue roting key
        x-message-ttl: 3000 # It will drop to the main queue after 3 seconds.
        x-queue-mode: lazy      
      exchange:
        name: rabbit_two_queue_exchange
        durable: true
        type: direct
